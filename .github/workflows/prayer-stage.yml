name: Verify exact in-place prayer preview source
on:
  push:
    branches: ['fix/inplace-prayers-0-0-005']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reconstruct and verify edited source hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .prayer-stage/stage.cjs prepare
      - name: Build and regression tests - no paid model calls
        working-directory: /tmp/wholehearted-prayer-stage
        run: |
          node build.cjs
          node --test tests/*.test.cjs
      - name: Live official ESV passage checks
        working-directory: /tmp/wholehearted-prayer-stage
        run: node tests/live-scripture.cjs
      - name: Install test engines
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Existing real-HTTP journey and live Scripture - AI fixture
        working-directory: /tmp/wholehearted-prayer-stage
        env:
          BROWSER_MODE: http
          LIVE_ESV: '1'
        run: python tests/completion-browser.py
      - name: Field feedback and navigation - Chromium fixture
        working-directory: /tmp/wholehearted-prayer-stage
        env:
          BROWSER_MODE: http
        run: python tests/experience-browser.py
      - name: Field feedback and navigation - Linux WebKit fixture
        working-directory: /tmp/wholehearted-prayer-stage
        env:
          BROWSER_MODE: http
          TEST_BROWSER: webkit
        run: python tests/experience-browser.py
      - name: In-place population, partial recovery and source sections - Chromium fixture
        working-directory: /tmp/wholehearted-prayer-stage
        env:
          BROWSER_MODE: http
        run: python tests/inplace-browser.py
      - name: In-place population, partial recovery and source sections - Linux WebKit fixture
        working-directory: /tmp/wholehearted-prayer-stage
        env:
          BROWSER_MODE: http
          TEST_BROWSER: webkit
        run: python tests/inplace-browser.py
      - name: Publish verified source blobs only - no branch updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .prayer-stage/stage.cjs publish

name: Wholehearted in-place prayer and response checks
on:
  push:
    branches: ['fix/inplace-prayers-0-0-005']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build exact browser assets
        run: node build.cjs
      - name: Unit and API-contract tests (no paid model calls)
        run: node --test tests/*.test.cjs
      - name: Check all official ESV passage embeds
        run: node tests/live-scripture.cjs
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Browser HTTP, native storage, downloads and live ESV (AI fixture)
        env:
          BROWSER_MODE: http
          LIVE_ESV: '1'
        run: python tests/completion-browser.py
      - name: Targeted feedback, Contents and viewport checks (Chromium, AI fixture)
        env:
          BROWSER_MODE: http
        run: python tests/experience-browser.py
      - name: Targeted feedback and responsive checks (Linux WebKit, not physical Safari)
        env:
          BROWSER_MODE: http
          TEST_BROWSER: webkit
        run: python tests/experience-browser.py
      - name: In-place prayer population and partial recovery (Chromium, AI fixture)
        env:
          BROWSER_MODE: http
        run: python tests/inplace-browser.py
      - name: In-place prayer population and partial recovery (Linux WebKit, AI fixture)
        env:
          BROWSER_MODE: http
          TEST_BROWSER: webkit
        run: python tests/inplace-browser.py

name: Wholehearted completion checks
on:
  push:
    branches: ['completion/wholehearted-0-0-002']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build exact browser assets
        run: node build.cjs
      - name: Unit and API-contract tests (no paid model calls)
        run: node --test tests/*.test.cjs
      - name: Check all official ESV passage embeds
        run: node tests/live-scripture.cjs
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser HTTP, native storage, downloads and live ESV (AI fixture)
        env:
          BROWSER_MODE: http
          LIVE_ESV: '1'
        run: python tests/completion-browser.py

name: Wholehearted preview checks
on:
  push:
    branches: ['completion/wholehearted-0-0-002']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official ESV source
        run: node source-probe.cjs
      - run: node build.cjs
      - run: node --test tests/*.test.cjs

name: Stage and verify Wholehearted completion
on:
  push:
    branches: ['completion/wholehearted-0-0-002']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare exact locally tested source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .completion/stage.cjs prepare
      - name: Build and unit tests
        working-directory: /tmp/wholehearted-stage
        run: |
          node build.cjs
          node --test tests/*.test.cjs
      - name: All official ESV passage ranges
        working-directory: /tmp/wholehearted-stage
        run: node tests/live-scripture.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native HTTP browser, storage, downloads and live Scripture - AI fixture
        working-directory: /tmp/wholehearted-stage
        env:
          BROWSER_MODE: http
          LIVE_ESV: '1'
        run: python tests/completion-browser.py
      - name: Stage verified source as Git objects only - no branch update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .completion/stage.cjs publish
